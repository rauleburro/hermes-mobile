name: CI

# Two layers: contributors validate locally (`pnpm validate` stamps the commit
# with a receipt), and this workflow first checks that receipt in seconds. Full
# CI only starts for PRs whose receipt is valid, and always runs on main.
# Never switch this to `pull_request_target`: it would run fork code with
# repository secrets and a write token.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PRs share one group per branch, so a new push cancels the superseded run.
  # Each push to main gets its own group (keyed by commit), so no main commit's
  # run is ever cancelled or dropped while pending.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  receipt:
    name: Validation receipt
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Check out the PR head commit itself (not the synthetic merge commit):
      # the receipt is a trailer on that exact commit.
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # No dependency install here on purpose: the script has no dependencies.
      - name: Check validation receipt
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/receipt.mjs check "$HEAD_SHA"

  ci:
    name: Full CI
    needs: receipt
    # On PRs: only when the receipt job succeeded (a failed receipt, or a
    # skipped one for drafts, skips this job). On push to main the receipt job
    # is skipped (the squash commit carries no trailer) and CI runs anyway.
    # `!cancelled()` rather than `always()`, which would also start this job
    # after the run was cancelled.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.receipt.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pnpm version comes from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Hygiene
        run: pnpm hygiene
